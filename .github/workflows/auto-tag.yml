name: Auto Tag on Version Change

on:
  push:
    branches: [ main ]
    paths: [ 'package.json' ]

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 2
        token: ${{ github.token }}

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
    
    - name: Get current version
      id: current-version
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $VERSION"
    
    - name: Get previous version
      id: previous-version
      run: |
        git checkout HEAD~1 -- package.json 2>/dev/null || echo "No previous version"
        PREV_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "none")
        echo "previous=$PREV_VERSION" >> $GITHUB_OUTPUT
        echo "Previous version: $PREV_VERSION"
        git checkout HEAD -- package.json
    
    - name: Check if version changed
      id: version-check
      run: |
        CURRENT="${{ steps.current-version.outputs.version }}"
        PREVIOUS="${{ steps.previous-version.outputs.previous }}"
        
        if [ "$CURRENT" != "$PREVIOUS" ]; then
          echo "Version changed from $PREVIOUS to $CURRENT"
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "tag=v$CURRENT" >> $GITHUB_OUTPUT
        else
          echo "Version unchanged: $CURRENT"
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Validate release notes
      if: steps.version-check.outputs.changed == 'true'
      run: |
        node scripts/generate-release-notes.mjs \
          "${{ steps.current-version.outputs.version }}" \
          "${{ steps.previous-version.outputs.previous }}" \
          > release-notes.md
        test -s release-notes.md
        cat release-notes.md

    - name: Create and push tag
      if: steps.version-check.outputs.changed == 'true'
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        TAG="${{ steps.version-check.outputs.tag }}"

        if [ -z "$PAT_TOKEN" ]; then
          echo "PAT_TOKEN is required so the tag push can trigger the Docker release workflow"
          exit 1
        fi
        
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping"
          exit 0
        fi
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git tag -a "$TAG" -m "Release version ${{ steps.current-version.outputs.version }}"
        git push https://x-access-token:$PAT_TOKEN@github.com/${{ github.repository }}.git "$TAG"
        
        echo "Created and pushed tag: $TAG"
